spring.application.name=daejung-dist-backend

jwt.secret=${JWT_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

app.refresh.store=${REFRESH_STORE}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=2s

# 회원가입 인증 메일은 Gmail SMTP로 보낸다. 비밀번호는 Google 계정의 앱 비밀번호다
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 암호화되지 않은 연결로는 보내지 않는다
spring.mail.properties.mail.smtp.starttls.required=true
# Gmail이 응답하지 않을 때 요청 스레드가 오래 묶이지 않게 한다
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
